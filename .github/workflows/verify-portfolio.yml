name: Verify portfolio code and figures

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Regenerate summary charts
        run: python scripts/build_summary_figures.py
      - name: Ensure generated figures are committed
        run: git diff --exit-code -- figures/
